name: Build and Release Chinese FreqUI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release freqUI.zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build FreqUI
        run: pnpm run build

      - name: Package freqUI.zip
        run: |
          cd dist
          zip -r ../freqUI.zip .
          cd ..

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "FreqUI 中文汉化版 (Latest)"
          body: |
            自动构建的最新 FreqUI 中文汉化版本。
            - 包含完整的简体中文本地化支持
            - 可直接用于 Freqtrade 官方后端或 Docker 部署
          files: freqUI.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
